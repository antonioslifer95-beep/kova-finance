<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Kova Finance — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class'}</script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold"><span class="text-indigo-400">Kova</span> Finance</h1>
      <p class="text-gray-400 mt-1 text-sm">Document Management</p>
    </div>
    <div class="bg-gray-900 rounded-xl border border-gray-800 p-8 shadow-2xl">
      {% if error %}
      <div class="mb-4 px-4 py-2 bg-red-900/40 border border-red-700 rounded-lg text-red-300 text-sm">
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-sm text-gray-400 mb-1">Username</label>
          <input name="username" type="text" required autofocus
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                        text-gray-100 placeholder-gray-500"/>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Password</label>
          <input name="password" type="password" required
                 class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm
                        focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                        text-gray-100 placeholder-gray-500"/>
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg
                       transition-colors text-sm">
          Sign in
        </button>
      </form>
    </div>
  </div>
</body>
</html>

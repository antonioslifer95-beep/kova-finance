<div class="bg-gray-900 border border-gray-800 rounded-xl p-5"
     x-data="{ persons: [{ name: '', income: '', crc: '' }] }">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-sm font-semibold text-gray-300">Dados dos Requerentes</h2>
    <button type="button" @click="persons.push({ name: '', income: '', crc: '' })"
            x-show="persons.length < 3"
            class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
      + Adicionar requerente
    </button>
  </div>

  <input type="hidden" name="person_count" :value="persons.length">

  <div class="grid gap-4"
       :class="persons.length === 1 ? 'grid-cols-1' : persons.length === 2 ? 'grid-cols-2' : 'grid-cols-3'">
    <template x-for="(p, i) in persons" :key="i">
      <div class="bg-gray-800/50 border border-gray-700 rounded-xl overflow-hidden">
        <div class="px-4 py-2.5 bg-indigo-700 flex items-center justify-between">
          <span class="text-sm font-semibold text-white"
                x-text="persons.length === 1 ? 'Requerente' : 'Requerente ' + (i + 1)"></span>
          <button type="button" @click="persons.splice(i, 1)"
                  x-show="persons.length > 1"
                  class="text-indigo-200 hover:text-white transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="p-4 space-y-3">
          <div>
            <label class="block text-xs text-gray-500 mb-1">Nome</label>
            <input type="text" :name="'p' + i + '_name'" x-model="p.name"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm
                          text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="Nome completo"/>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Rendimento mensal médio (€)</label>
            <input type="number" :name="'p' + i + '_income'" x-model="p.income" min="0" step="0.01"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm
                          text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="ex: 1500"/>
          </div>
          <div>
            <label class="block text-xs text-gray-500 mb-1">Responsabilidades de crédito (€/mês)</label>
            <input type="number" :name="'p' + i + '_crc'" x-model="p.crc" min="0" step="0.01"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm
                          text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="ex: 200"/>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>
